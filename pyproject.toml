[project]
name = "citl"
version = "0.0.0+alpha"
description = ""
authors = [{ name = "John Brandon Graham Jones", email = "john.brandon.jones@icloud.com" }]
requires-python = "~=3.12"
readme = "README.md"
dependencies = [
    "timm",
    "albumentations>=2.0.5",
    "torchvision",
    "loguru",
    "neptune",
    "more_itertools",
    "onnx",
    "torch-tb-profiler",
    "tensorboard",
    "onnxruntime",
    "blinker",
    "pyparsing",
    "seaborn>=0.13.2,<0.14",
    "torchcp>=1.0.1,<2",
    "torch-geometric>=2.6.1,<3",
    "transformers>=4.47.1,<5",
    "typer",
    "rasterio>=1.4.3,<2",
    "geopandas>=1.0.1,<2",
    "ipykernel>=6.29.5,<7",
    "jupyter>=1.1.1,<2",
    "ipywidgets>=8.1.5,<9",
    "torchmetrics==1.6.0",
    "einops>=0.8.0,<0.9",
    "einops-exts>=0.0.4,<0.0.5",
    "python-dotenv>=1.0.1,<2",
    "huggingface-hub[cli]>=0.28.1,<0.29",
    "torch==2.5.1+cu121",
    "nvidia-cublas-cu12",
    "nvidia-cuda-cupti-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-nccl-cu12",
    "nvidia-nvtx-cu12",
    "pytorch-lightning==2.5.0",
    "segmentation-models-pytorch>=0.4.0",
    "torchinfo>=1.8.0",
    "onnxruntime-gpu>=1.21.0",
]

[dependency-groups]
dev = [
    "ruff",
    "coverage",
]

[tool.uv]

[tool.uv.sources]
torch = { index = "pytorch" }
nvidia-cublas-cu12 = {index = "pytorch"}
nvidia-cuda-cupti-cu12 = {index = "pytorch"}
nvidia-cuda-nvrtc-cu12 = {index = "pytorch"}
nvidia-cuda-runtime-cu12 = {index = "pytorch"}
nvidia-cudnn-cu12 = {index = "pytorch"}
nvidia-cufft-cu12 = {index = "pytorch"}
nvidia-curand-cu12 = {index = "pytorch"}
nvidia-cusolver-cu12 = {index = "pytorch"}
nvidia-cusparse-cu12 = {index = "pytorch"}
nvidia-nccl-cu12 = {index = "pytorch"}
nvidia-nvtx-cu12= {index = "pytorch"}

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/"
explicit = true

[tool.isort]
atomic = true
profile = "black"
line_length = 88
skip_glob = ["tests/data", "profiling", "datasets", "lightning_logs"]
known_first_party = ["black", "blib2to3", "blackd", "_black_version"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = [
    "test"
]
addopts = "--strict-config --strict-markers --cov=citl --cov-report term-missing --cov-report xml:coverage.xml"
xfail_strict = true
filterwarnings = [
    "error",
    # this is mitigated by a try/catch in https://github.com/psf/black/pull/2974/
    # this ignore can be removed when support for aiohttp 3.7 is dropped.
    '''ignore:Decorator `@unittest_run_loop` is no longer needed in aiohttp 3\.8\+:DeprecationWarning''',
    # this is mitigated by a try/catch in https://github.com/psf/black/pull/3198/
    # this ignore can be removed when support for aiohttp 3.x is dropped.
    '''ignore:Middleware decorator is deprecated since 4\.0 and its behaviour is default, you can simply remove this decorator:DeprecationWarning''',
    # aiohttp is using deprecated cgi modules - Safe to remove when fixed:
    # https://github.com/aio-libs/aiohttp/issues/6905
    '''ignore:'cgi' is deprecated and slated for removal in Python 3.13:DeprecationWarning''',
    # Work around https://github.com/pytest-dev/pytest/issues/10977 for Python 3.12
    '''ignore:(Attribute s|Attribute n|ast.Str|ast.Bytes|ast.NameConstant|ast.Num) is deprecated and will be removed in Python 3.14:DeprecationWarning''',
    # Will be fixed with aiohttp 3.9.0
    # https://github.com/aio-libs/aiohttp/pull/7302
    "ignore:datetime.*utcfromtimestamp\\(\\) is deprecated and scheduled for removal:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "citl"
strict = true
warn_unreachable = true
implicit_reexport = true
show_error_codes = true
show_column_numbers = true

[tool.coverage.report]
omit = [
]

[tool.coverage.run]
relative_files = true
branch = true
